name: airbnb
version: "1.0.0"
config-version: 2

profile: airbnb

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

test-paths: ["tests"]

clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  airbnb:
    +schema: raw

models:
  airbnb:
    +materialized: view
    dim:
      +materialized: table
    src:
      +materialized: ephemeral

tests:
  +store_failures: true